<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Understage Admin</title>
  <style>
    :root {
      --bg: #0E0B10;
      --card: #17121B;
      --gold: #D4A64A;
      --red: #B3263E;
      --green: #3FB27F;
      --muted: #9A8F99;
      --text: #F3EDE4;
      --line: #2A232F;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    a { color: var(--gold); }
    header {
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      padding: 16px 28px; border-bottom: 1px solid var(--line); background: #120E15;
      position: sticky; top: 0; z-index: 5;
    }
    header h1 { margin: 0; font-size: 18px; letter-spacing: .04em; }
    header h1 span { color: var(--gold); }
    nav { display: flex; gap: 4px; flex-wrap: wrap; }
    nav button {
      background: transparent; border: 0; color: var(--muted); padding: 8px 12px;
      border-radius: 8px; cursor: pointer; font: inherit;
    }
    nav button.on { color: var(--bg); background: var(--gold); font-weight: 600; }
    main { max-width: 1100px; margin: 0 auto; padding: 28px 24px 80px; }
    .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 22px; }
    .kpi { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
    .kpi b { display: block; font-size: 26px; color: var(--gold); }
    .kpi span { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; margin: 0 0 14px; }
    .row { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; }
    .muted { color: var(--muted); }
    .small { font-size: 13px; }
    .tag { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; background: #2A232F; color: var(--muted); }
    .tag.new, .tag.open { background: #3a2410; color: var(--gold); }
    .tag.review, .tag.pending { background: #2a2610; color: #E6C56A; }
    .tag.ok, .tag.resolved, .tag.actioned { background: #133226; color: var(--green); }
    .tag.bad, .tag.dismissed, .tag.perm { background: #3a1520; color: #E07080; }
    button.act, button.ghost, button.danger {
      font: inherit; cursor: pointer; border-radius: 8px; padding: 8px 14px; border: 1px solid var(--line);
    }
    button.act { background: var(--gold); color: #1a1408; font-weight: 650; border-color: var(--gold); }
    button.ghost { background: transparent; color: var(--text); }
    button.danger { background: var(--red); color: white; border-color: var(--red); }
    button:disabled { opacity: .5; cursor: default; }
    input, textarea, select {
      width: 100%; background: #0E0B10; color: var(--text); border: 1px solid var(--line);
      border-radius: 8px; padding: 10px 12px; font: inherit; margin: 6px 0 12px;
    }
    textarea { min-height: 88px; resize: vertical; }
    .login { max-width: 420px; margin: 80px auto; }
    .note { background: #20181A; border: 1px solid #3a2a22; color: #E8D5B5; border-radius: 10px; padding: 12px 14px; margin: 12px 0 18px; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { color: var(--muted); font-weight: 500; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; }
    .toast { position: fixed; bottom: 20px; right: 20px; background: var(--gold); color: #1a1408; padding: 10px 16px; border-radius: 8px; font-weight: 600; }
    .err { color: #E07080; }
    .split { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 800px) { .split { grid-template-columns: 1fr; } header { flex-wrap: wrap; } }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
    .evidence { background: #120E15; border-radius: 10px; padding: 10px 12px; margin: 8px 0; white-space: pre-wrap; }
    label { display: block; color: var(--muted); font-size: 13px; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="/admin/app.js"></script>
</body>
</html>
