[package]
name = "mls-poc"
version = "0.1.0"
edition = "2021"
publish = false
description = "Throwaway OpenMLS 0.9.2 Phase 0 compile-and-round-trip check for Understage"

[lib]
name = "mls_poc"
path = "src/lib.rs"
crate-type = ["rlib", "staticlib"]

[dependencies]
openmls = "=0.9.2"
openmls_basic_credential = "0.6.0"
openmls_rust_crypto = "0.6.0"
openmls_sqlite_storage = "0.3.0"
openmls_traits = "0.6.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
